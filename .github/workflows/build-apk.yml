name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 @capacitor/status-bar@6.0.2
          npm install --save-dev @capacitor/assets@3.0.5
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.snackothman.menu",
            "appName": "سناك عثمان",
            "webDir": "www",
            "backgroundColor": "#0e0b0a",
            "android": { "backgroundColor": "#0e0b0a" },
            "plugins": { "StatusBar": { "style": "DARK", "backgroundColor": "#0e0b0a" } }
          }
          EOF
          npx cap add android

      - name: Make the app icon
        continue-on-error: true
        run: |
          IM="convert"; command -v magick >/dev/null 2>&1 && IM="magick"
          mkdir -p assets
          $IM -size 1024x1024 xc:'#0e0b0a' assets/icon-background.png
          $IM -size 1024x1024 xc:none \
            -fill '#f3a712' -draw 'circle 512,512 512,196' \
            -fill '#0e0b0a' -draw 'circle 428,452 428,392' -draw 'circle 512,420 512,350' -draw 'circle 596,452 596,392' \
            -draw 'roundrectangle 408,470 616,640 22,22' \
            -fill '#f3a712' -draw 'rectangle 408,590 616,604' \
            assets/icon-foreground.png
          $IM assets/icon-background.png assets/icon-foreground.png -composite assets/icon-only.png
          npx capacitor-assets generate --android

      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Snack-Othman-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
