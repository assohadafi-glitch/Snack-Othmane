name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 @capacitor/status-bar@6.0.2
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.snackothman.menu",
            "appName": "سناك عثمان",
            "webDir": "www",
            "backgroundColor": "#0e0b0a",
            "android": { "backgroundColor": "#0e0b0a" },
            "plugins": { "StatusBar": { "style": "DARK", "backgroundColor": "#0e0b0a" } }
          }
          EOF
          npx cap add android

      - name: Apply the app icon
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*.png' -delete
          find $R -name 'ic_launcher*.webp' -delete
          mkdir -p $R/mipmap-anydpi-v26 $R/values
          cat > $R/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#F7B229</color>
          </resources>
          EOF
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-foreground.png').convert('RGBA')
          for d, m in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              s = int(48 * m)
              a = full.resize((s, s), Image.LANCZOS)
              a.save(f'{p}/ic_launcher.png')
              mask = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s - 1, s - 1), fill=255)
              r = a.copy()
              r.putalpha(mask)
              r.save(f'{p}/ic_launcher_round.png')
              f = int(108 * m)
              fg.resize((f, f), Image.LANCZOS).save(f'{p}/ic_launcher_foreground.png')
          PY

      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Snack-Othman-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
